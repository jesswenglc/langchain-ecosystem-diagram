<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Business logic configures the harness</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <rect x="230" y="150" width="880" height="140" rx="18" fill="none" stroke="#3fb950" stroke-width="2.5"  opacity="1"/><text x="266" y="194" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3fb950" text-anchor="start" opacity="1"  >Business Logic</text><text x="266" y="218" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >prompts, skills, tools, subagents</text><text x="266" y="246" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >* The same prompt, tools, skills, and subagents you already configure with create_deep_agent() in Python,</text><text x="266" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >expressed as project files instead: there is no live Python session at deploy time to pass them in directly.</text><rect x="230" y="320" width="880" height="100" rx="18" fill="none" stroke="#e3b341" stroke-width="2.5"  opacity="1"/><text x="266" y="364" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >Deep Agents harness</text><text x="266" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >create_deep_agent(): orchestrates prompts, skills, and tools into the model loop</text><path d="M1110,220 C 1200,220 1200,342 1110,342" fill="none" stroke="#e6edf3" stroke-width="2.2" stroke-dasharray="2,6" opacity="0.85"/><polygon points="1110,342 1120,336.5 1120,347.5" fill="#e6edf3" opacity="0.85"/><text x="1218" y="286" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >configures</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >Nothing new here: this is create_deep_agent(), the same harness from the earlier slides, reading its config from disk.</text>
</svg>