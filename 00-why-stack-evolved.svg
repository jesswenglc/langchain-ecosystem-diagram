<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Why this stack evolved</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Roadmap</text>
  <rect x="420" y="210" width="760" height="115" rx="10" fill="none" stroke="#e3b341" stroke-width="2.4"  opacity="1"/><text x="800" y="254" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e3b341" text-anchor="middle" opacity="1"  >Deep Agents</text><text x="800" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >create_deep_agent(): middleware on top of the loop</text><text x="1164" y="311" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8b949e" text-anchor="end" opacity="0.75"  >depends on langchain&gt;=1.3.14,&lt;2.0.0</text><path d="M1220,343 L 1220,307" fill="none" stroke="#e6edf3" stroke-width="2" opacity="0.8"/><polygon points="1220,307 1224.95,316 1215.05,316" fill="#e6edf3" opacity="0.8"/><text x="1236" y="317" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >layers on middleware for what a bare</text><text x="1236" y="339" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >loop lacks: planning, memory, subagents</text><rect x="420" y="325" width="760" height="115" rx="10" fill="none" stroke="#3fb950" stroke-width="2.4"  opacity="1"/><text x="800" y="369" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >LangChain</text><text x="800" y="393" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >create_agent(): the prebuilt agent loop</text><text x="1164" y="426" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8b949e" text-anchor="end" opacity="0.75"  >depends on langgraph&gt;=1.2.11,&lt;1.3.0</text><path d="M1220,458 L 1220,422" fill="none" stroke="#e6edf3" stroke-width="2" opacity="0.8"/><polygon points="1220,422 1224.95,431 1215.05,431" fill="#e6edf3" opacity="0.8"/><text x="1236" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >built on top, to inherit LangGraph's primitives:</text><text x="1236" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >durable execution, streaming, HITL</text><rect x="420" y="440" width="760" height="115" rx="10" fill="none" stroke="#58a6ff" stroke-width="2.4"  opacity="1"/><text x="800" y="484" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >LangGraph</text><text x="800" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >the graph execution engine</text><text x="1164" y="541" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8b949e" text-anchor="end" opacity="0.75"  >depends on langchain-core&gt;=1.4.7,&lt;2</text><path d="M1220,573 L 1220,537" fill="none" stroke="#e6edf3" stroke-width="2" opacity="0.8"/><polygon points="1220,537 1224.95,546 1215.05,546" fill="#e6edf3" opacity="0.8"/><text x="1236" y="547" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >adds a graph-based runtime</text><text x="1236" y="569" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >for stateful, long-running agents</text><rect x="420" y="555" width="760" height="115" rx="10" fill="none" stroke="#8b949e" stroke-width="2.4"  opacity="1"/><text x="800" y="599" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8b949e" text-anchor="middle" opacity="1"  >langchain-core</text><text x="800" y="623" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >shared primitives: messages, runnables, base abstractions</text><text x="800" y="712" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >deepagents doesn't depend on langgraph directly; it inherits it transitively through langchain.</text>
</svg>