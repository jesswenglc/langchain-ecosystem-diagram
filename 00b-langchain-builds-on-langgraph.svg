<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >LangChain builds on top of LangGraph</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Roadmap</text>
  <rect x="210" y="170" width="520" height="120" rx="14" fill="none" stroke="#e6edf3" stroke-width="2"  opacity="0.85"/><text x="470" y="216" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1"  >Traditional software runs a control</text><text x="470" y="239" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1"  >flow you wrote ahead of time.</text><text x="470" y="266" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1"  >Agents decide at runtime what to do.</text><path d="M470,290 L 470,420" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="470,420 464.5,410 475.5,410" fill="#e6edf3" opacity="0.8"/><text x="498" y="347" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >introduced as a graph-based</text><text x="498" y="369" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >runtime for that runtime control</text><rect x="210" y="420" width="520" height="110" rx="14" fill="none" stroke="#58a6ff" stroke-width="2.4"  opacity="1"/><text x="470" y="481.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >LangGraph</text><path d="M730,475 L 870,475" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="870,475 860,480.5 860,469.5" fill="#e6edf3" opacity="0.8"/><text x="1130" y="364" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >built on top, to inherit LangGraph's primitives:</text><text x="1130" y="386" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >durable execution, streaming, HITL</text><rect x="870" y="420" width="520" height="110" rx="14" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-dasharray="7,6" opacity="1"/><text x="1130" y="481.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >LangChain</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >"create_agent became LangChain's minimal harness, which we built on top of LangGraph because production agents need its primitives." Source: langchain.com/blog/deep-agents-vs-langchain-vs-langgraph</text>
</svg>