.2"/><text x="170" y="505" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >request</text><rect x="290" y="468" width="150" height="64" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="365" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >before_agent</text><rect x="490" y="468" width="150" height="64" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="565" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >before_model</text><rect x="690" y="360" width="210" height="96" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="795" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >wrap_tool_call</text><rect x="705" y="416" width="180" height="26" rx="6" fill="none" stroke="#3fb950" stroke-width="1.4"  opacity="0.55"/><text x="795" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3fb950" text-anchor="middle" opacity="0.85"  >tools</text><rect x="690" y="560" width="210" height="96" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="795" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >wrap_model_call</text><rect x="705" y="616" width="180" height="26" rx="6" fill="none" stroke="#3fb950" stroke-width="1.4"  opacity="0.55"/><text x="795" y="633" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3fb950" text-anchor="middle" opacity="0.85"  >model</text><rect x="950" y="468" width="150" height="64" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="1025" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >after_model</text><rect x="1150" y="468" width="150" height="64" rx="10" fill="none" stroke="#3fb950" stroke-width="2.2"  opacity="1"/><text x="1225" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >after_agent</text><ellipse cx="1430" cy="500" rx="70" ry="34" fill="#0d1117" stroke="#3fb950" stroke-width="2.2"/><text x="1430" y="505" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >result</text><text x="690" y="700" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >before_/after_ hooks run once per turn.</text><text x="690" y="724" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >wrap_ hooks run around every model or tool call.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >The extension point that Deep Agents' default middleware is built on.</text>
