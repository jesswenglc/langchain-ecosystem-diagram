<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >How opinionated is the abstraction?</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <text x="170" y="210" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8b949e" text-anchor="start" opacity="1"  >ABSTRACTION: WHAT THE AGENT DOES</text><rect x="170" y="232" width="380" height="120" rx="14" fill="none" stroke="#58a6ff" stroke-width="2.4"  opacity="1"/><text x="360" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >LangGraph</text><rect x="610" y="232" width="380" height="120" rx="14" fill="none" stroke="#3fb950" stroke-width="2.4"  opacity="1"/><text x="800" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1"  >LangChain</text><rect x="1050" y="232" width="380" height="120" rx="14" fill="none" stroke="#e3b341" stroke-width="2.4"  opacity="1"/><text x="1240" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e3b341" text-anchor="middle" opacity="1"  >Deep Agents</text><path d="M550,292 L 610,292" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="610,292 600,297.5 600,286.5" fill="#e6edf3" opacity="0.8"/><path d="M990,292 L 1050,292" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="1050,292 1040,297.5 1040,286.5" fill="#e6edf3" opacity="0.8"/><defs><linearGradient id="grad-170-392" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#3fb950"/><stop offset="100%" stop-color="#e3b341"/></linearGradient></defs><rect x="170" y="390.25" width="1260" height="3.5" fill="url(#grad-170-392)"/><polygon points="170,392 181,385.95 181,398.05" fill="#e6edf3" opacity="0.9"/><text x="371.6" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >max determinism</text><polygon points="1430,392 1419,398.05 1419,385.95" fill="#e6edf3" opacity="0.9"/><text x="1228.4" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >max agency</text><text x="192" y="472" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">LangGraph:</tspan><tspan> full control, you define every node and edge yourself.</tspan></text><text x="192" y="512" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">LangChain's create_agent():</tspan><tspan> prewires nodes and edges into a ReAct loop: model + tools in, an agent loop out.</tspan></text><text x="192" y="552" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Deep Agents' create_deep_agent():</tspan><tspan> adds default middleware on top of that loop: planning, a filesystem, subagents, and human-in-the-loop.</tspan></text><text x="170" y="648" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="0.85" font-style="italic" >Still want to customize everything yourself? LangGraph is right there for that: these are opinionated defaults the engineers recommend, not a ceiling.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >This is the same LangGraph/LangChain/Deep Agents stack from the earlier slides, viewed as a single axis.</text>
</svg>