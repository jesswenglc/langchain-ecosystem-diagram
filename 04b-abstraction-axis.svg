elf.</tspan></text><text x="192" y="512" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">LangChain's create_agent():</tspan><tspan> prewires nodes and edges into a ReAct loop: model + tools in,</tspan></text><text x="192" y="538" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >an agent loop out.</text><text x="192" y="578" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Deep Agents' create_deep_agent():</tspan><tspan> adds default middleware on top of that loop: planning, a</tspan></text><text x="192" y="604" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >filesystem, subagents, and human-in-the-loop.</text><text x="170" y="666" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="0.85" font-style="italic" >Still want to customize everything yourself? LangGraph is right there for</text><text x="170" y="688" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="0.85" font-style="italic" >that: these are opinionated defaults the engineers recommend, not a ceiling.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >This is the same LangGraph/LangChain/Deep Agents stack from the earlier slides, viewed as a single axis.</text>
