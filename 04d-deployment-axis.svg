<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Who operates the Agent Server?</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <rect x="152" y="210" width="636" height="188" rx="20" fill="none" stroke="#e6edf3" stroke-width="1.4" stroke-dasharray="8,6" opacity="0.5"/><text x="470" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="0.9"  >YOUR INFRASTRUCTURE</text><rect x="170" y="260" width="600" height="120" rx="14" fill="none" stroke="#e6edf3" stroke-width="2.4"  opacity="1"/><text x="470" y="326" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1"  >Self-hosted Deep Agents</text><rect x="812" y="210" width="636" height="188" rx="20" fill="#a371f7" stroke="#a371f7" stroke-width="1.4"  opacity="0.1"/><rect x="812" y="210" width="636" height="188" rx="20" fill="none" stroke="#a371f7" stroke-width="1.4"  opacity="0.5"/><text x="1130" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a371f7" text-anchor="middle" opacity="0.9"  >LANGSMITH'S INFRASTRUCTURE</text><rect x="830" y="260" width="600" height="120" rx="14" fill="none" stroke="#a371f7" stroke-width="2.4"  opacity="1"/><text x="1130" y="326" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a371f7" text-anchor="middle" opacity="1"  >Managed Deep Agents</text><path d="M770,320 L 830,320" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="830,320 820,325.5 820,314.5" fill="#e6edf3" opacity="0.8"/><defs><linearGradient id="grad-170-438" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#e6edf3"/><stop offset="100%" stop-color="#a371f7"/></linearGradient></defs><rect x="170" y="436.25" width="1260" height="3.5" fill="url(#grad-170-438)"/><polygon points="170,438 181,431.95 181,444.05" fill="#e6edf3" opacity="0.9"/><text x="371.6" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >you build &amp; operate</text><polygon points="1430,438 1419,444.05 1419,431.95" fill="#e6edf3" opacity="0.9"/><text x="1228.4" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >infra included</text><text x="192" y="518" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Self-hosted Deep Agents:</tspan><tspan> the same create_deep_agent() harness on your own Agent Server; you run the containers, Postgres, and Redis behind it.</tspan></text><text x="192" y="558" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Managed Deep Agents:</tspan><tspan> that same harness on LangSmith's Agent Server, plus an opinionated layer on top:</tspan></text><text x="192" y="584" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >sandboxes, memory, channels, identity, and evals, none of it built or operated by you.</text><text x="170" y="650" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Independent of the abstraction axis: a plain LangGraph graph can also run on Managed Deep Agents, and a deep agent can also be self-hosted.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >A separate axis from abstraction: it changes nothing about how the agent is defined.</text>
</svg>