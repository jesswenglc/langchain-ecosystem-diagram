<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >LangGraph: the agent runtime</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Step 1: the runtime</text>
  <rect x="80" y="660" width="1440" height="220" rx="18" fill="none" stroke="#58a6ff" stroke-width="2.5"  opacity="1"/><text x="116" y="704" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="start" opacity="1"  >LangGraph</text><text x="116" y="728" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >the agent runtime: nodes and edges are defined explicitly</text><path d="M170,810 L 320,810" fill="none" stroke="#58a6ff" stroke-width="2.2"/><polygon points="320,810 310,815.5 310,804.5" fill="#58a6ff" opacity="1"/><path d="M320,810 L 460,776" fill="none" stroke="#58a6ff" stroke-width="2.2"/><polygon points="460,776 451.58044826511184,783.7046186527006 448.9844776560037,773.0153279093141" fill="#58a6ff" opacity="1"/><path d="M320,810 L 460,844" fill="none" stroke="#58a6ff" stroke-width="2.2"/><polygon points="460,844 448.9844776560037,846.9846720906859 451.58044826511184,836.2953813472994" fill="#58a6ff" opacity="1"/><circle cx="170" cy="810" r="26" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/><text x="170" y="815" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >A</text><circle cx="320" cy="810" r="26" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/><text x="320" y="815" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >B</text><circle cx="460" cy="776" r="24" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/><text x="460" y="781" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >C</text><circle cx="460" cy="844" r="24" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/><text x="460" y="849" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle" opacity="1"  >D</text><text x="640" y="800" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Full control over state, persistence,</text><text x="640" y="826" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >streaming, and human-in-the-loop.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >"The runtime offers the most control and the least abstraction; the harness offers the inverse." Source: langchain.com/blog/deep-agents-vs-langchain-vs-langgraph</text>
</svg>