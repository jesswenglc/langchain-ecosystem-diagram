  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >How opinionated is the deployment?</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <text x="170" y="210" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8b949e" text-anchor="start" opacity="1"  >DEPLOYMENT: WHERE IT RUNS</text><rect x="170" y="232" width="600" height="120" rx="14" fill="none" stroke="#e6edf3" stroke-width="2.4"  opacity="1"/><text x="470" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1"  >Self-hosted Deep Agents</text><rect x="830" y="232" width="600" height="120" rx="14" fill="none" stroke="#a371f7" stroke-width="2.4"  opacity="1"/><text x="1130" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a371f7" text-anchor="middle" opacity="1"  >Managed Deep Agents</text><text x="1130" y="322" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >(LangSmith managed infrastructure)</text><path d="M770,292 L 830,292" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="830,292 820,297.5 820,286.5" fill="#e6edf3" opacity="0.8"/><path d="M170,392 L 191,392" fill="none" stroke="rgb(229,236,243)" stroke-width="3.5" opacity="0.9"/><path d="M191,392 L 212,392" fill="none" stroke="rgb(228,234,243)" stroke-width="3.5" opacity="0.9"/><path d="M212,392 L 233,392" fill="none" stroke="rgb(227,232,243)" stroke-width="3.5" opacity="0.9"/><path d="M233,392 L 254,392" fill="none" stroke="rgb(226,230,243)" stroke-width="3.5" opacity="0.9"/><path d="M254,392 L 275,392" fill="none" stroke="rgb(225,228,243)" stroke-width="3.5" opacity="0.9"/><path d="M275,392 L 296,392" fill="none" stroke="rgb(224,226,243)" stroke-width="3.5" opacity="0.9"/><path d="M296,392 L 317,392" fill="none" stroke="rgb(223,224,243)" stroke-width="3.5" opacity="0.9"/><path d="M317,392 L 338,392" fill="none" stroke="rgb(222,222,244)" stroke-width="3.5" opacity="0.9"/><path d="M338,392 L 359,392" fill="none" stroke