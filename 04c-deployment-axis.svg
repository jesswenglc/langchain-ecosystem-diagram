6)" stroke-width="3.5" opacity="0.9"/><path d="M1178,392 L 1199,392" fill="none" stroke="rgb(176,137,246)" stroke-width="3.5" opacity="0.9"/><path d="M1199,392 L 1220,392" fill="none" stroke="rgb(175,135,246)" stroke-width="3.5" opacity="0.9"/><path d="M1220,392 L 1241,392" fill="none" stroke="rgb(174,133,246)" stroke-width="3.5" opacity="0.9"/><path d="M1241,392 L 1262,392" fill="none" stroke="rgb(172,131,246)" stroke-width="3.5" opacity="0.9"/><path d="M1262,392 L 1283,392" fill="none" stroke="rgb(171,129,247)" stroke-width="3.5" opacity="0.9"/><path d="M1283,392 L 1304,392" fill="none" stroke="rgb(170,126,247)" stroke-width="3.5" opacity="0.9"/><path d="M1304,392 L 1325,392" fill="none" stroke="rgb(169,124,247)" stroke-width="3.5" opacity="0.9"/><path d="M1325,392 L 1346,392" fill="none" stroke="rgb(168,122,247)" stroke-width="3.5" opacity="0.9"/><path d="M1346,392 L 1367,392" fill="none" stroke="rgb(167,120,247)" stroke-width="3.5" opacity="0.9"/><path d="M1367,392 L 1388,392" fill="none" stroke="rgb(166,118,247)" stroke-width="3.5" opacity="0.9"/><path d="M1388,392 L 1409,392" fill="none" stroke="rgb(165,116,247)" stroke-width="3.5" opacity="0.9"/><path d="M1409,392 L 1430,392" fill="none" stroke="rgb(164,114,247)" stroke-width="3.5" opacity="0.9"/><polygon points="1430,392 1418,398.6 1418,385.4" fill="#a371f7" opacity="0.9"/><text x="800" y="422" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle" opacity="1" font-style="italic" >increasingly opinionated: more infra, less to build</text><text x="192" y="472" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Self-hosted Deep Agents:</tspan><tspan> the same create_deep_agent() harness, running wherever you</tspan></text><text x="192" y="498" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >run it; you build and operate the server, auth, and scaling.</text><text x="192" y="538" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e"><tspan fill="#8b949e">&#8226; </tspan><tspan font-weight="700" fill="#e6edf3">Managed Deep Agents:</tspan><tspan> that exact harness, unchanged, deployed onto LangSmith's</tspan></text><text x="192" y="564" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >infrastructure instead: a durable runtime, sandboxes, memory,</text><text x="192" y="590" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >and more, without you building or operating any of it.</text><text x="170" y="656" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Independent of the abstraction axis: a plain LangGraph graph can also run</text><text x="170" y="680" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >on Managed Deep Agents, and a deep agent can also be self-hosted.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >A separate axis from abstraction: it changes nothing about how the agent is defined.</text>
</svg>