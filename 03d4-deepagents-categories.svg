<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Deep Agents' middleware, by category</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Deep Agents middleware</text>
  <rect x="80" y="300" width="342" height="350" rx="16" fill="none" stroke="#e3b341" stroke-width="2"  opacity="1"/><text x="104" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >EXECUTION ENVIRONMENT</text><text x="104" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Where the agent reads and</text><text x="104" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >writes files during a run.</text><rect x="446" y="300" width="342" height="350" rx="16" fill="none" stroke="#e3b341" stroke-width="2"  opacity="1"/><text x="470" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >DELEGATION</text><text x="470" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Break work into a todo list, or</text><text x="470" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >hand off scoped work to a subagent.</text><rect x="812" y="300" width="342" height="350" rx="16" fill="none" stroke="#e3b341" stroke-width="2"  opacity="1"/><text x="836" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >STEERING</text><text x="836" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Pause for approval before a</text><text x="836" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >consequential tool call.</text><rect x="1178" y="300" width="342" height="350" rx="16" fill="none" stroke="#e3b341" stroke-width="2"  opacity="1"/><text x="1202" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >CONTEXT MANAGEMENT</text><text x="1202" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >What stays in context, gets</text><text x="1202" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >offloaded, or persists across runs.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >Together, these four categories make up what create_deep_agent() offers; filesystem and subagents are on by default, the rest is opt-in.</text>
</svg>