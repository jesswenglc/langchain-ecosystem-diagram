<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Plain Deep Agents vs. Managed Deep Agents</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <rect x="110" y="226" width="420" height="492" rx="20" fill="none" stroke="#e6edf3" stroke-width="1.4" stroke-dasharray="8,6" opacity="0.5"/><text x="320" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="0.9"  >PLAIN DEEP AGENTS</text><rect x="130" y="280" width="380" height="100" rx="14" fill="none" stroke="#e3b341" stroke-width="2.4"  opacity="1"/><text x="320" y="335.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e3b341" text-anchor="middle" opacity="1"  >create_deep_agent()</text><text x="130" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Called directly, in your own app.</text><text x="130" y="456" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >No HTTP server, no persistence,</text><text x="130" y="482" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >store, or task queue, and no</text><text x="130" y="508" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >sandboxes, unless you wire them in.</text><rect x="590" y="226" width="900" height="492" rx="20" fill="#a371f7" stroke="#a371f7" stroke-width="1.4"  opacity="0.08"/><rect x="590" y="226" width="900" height="492" rx="20" fill="none" stroke="#a371f7" stroke-width="1.4"  opacity="0.6"/><text x="1040" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a371f7" text-anchor="middle" opacity="0.95"  >MANAGED DEEP AGENTS</text><rect x="610" y="280" width="860" height="100" rx="14" fill="none" stroke="#e3b341" stroke-width="2.4"  opacity="1"/><text x="1040" y="335.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e3b341" text-anchor="middle" opacity="1"  >create_deep_agent()</text><text x="610" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8b949e" text-anchor="start" opacity="0.85"  >everything LangSmith wires in for you</text><rect x="610" y="436" width="418" height="90" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="628" y="464" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Agent Server</text><text x="628" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Durable execution &amp; streaming;</text><text x="628" y="503" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >schedules live here too.</text><rect x="1052" y="436" width="418" height="90" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="1070" y="464" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Context Hub</text><text x="1070" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Instructions, skills, and memory,</text><text x="1070" y="503" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >editable without a redeploy.</text><rect x="610" y="542" width="418" height="90" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="628" y="570" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Sandboxes</text><text x="628" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >For agents writing and running</text><text x="628" y="609" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >untrusted code.</text><rect x="1052" y="542" width="418" height="90" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="1070" y="570" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Connectors (MCP)</text><text x="1070" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Wires the agent loop to</text><text x="1070" y="609" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >external tools and systems.</text><text x="610" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >Also included: channels (e.g. Slack), auth, and Harbor evals.</text><path d="M510,330 L 610,330" fill="none" stroke="#e6edf3" stroke-width="2.2" opacity="0.8"/><polygon points="610,330 600,335.5 600,324.5" fill="#e6edf3" opacity="0.8"/><text x="130" y="768" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >The create_deep_agent() call is identical either way; Managed Deep Agents is what wires all of this in around it.</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >Self-hosting your own Agent Server gets you the basics without the extras above; that split is the next slide.</text>
</svg>