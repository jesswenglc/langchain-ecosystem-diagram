<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect x="0" y="0" width="1600" height="960" fill="#0d1117"/>
  <text x="80" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e6edf3" text-anchor="start" opacity="1"  >Managed Deep Agents: production concerns, same harness</text>
  <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1"  >deploying to production</text>
  <rect x="230" y="150" width="880" height="140" rx="18" fill="none" stroke="#3fb950" stroke-width="2.5"  opacity="1"/><text x="266" y="194" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3fb950" text-anchor="start" opacity="1"  >Your project files</text><text x="266" y="218" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >agent.json, AGENTS.md, tools.json, skills/</text><text x="266" y="246" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >* The same model, tools, system prompt, and middleware config you already know from create_deep_agent() in Python,</text><text x="266" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >written to disk as files instead: there is no live Python session at deploy time to pass them in directly.</text><rect x="230" y="320" width="880" height="100" rx="18" fill="none" stroke="#e3b341" stroke-width="2.5"  opacity="1"/><text x="266" y="364" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e3b341" text-anchor="start" opacity="1"  >Deep Agents harness</text><text x="266" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >create_deep_agent(): reads those files, wires up model + tools + middleware</text><path d="M1110,220 C 1200,220 1200,342 1110,342" fill="none" stroke="#e6edf3" stroke-width="2.2" stroke-dasharray="2,6" opacity="0.85"/><polygon points="1110,342 1120,336.5 1120,347.5" fill="#e6edf3" opacity="0.85"/><text x="1218" y="286" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >configures</text><rect x="230" y="460" width="880" height="360" rx="18" fill="none" stroke="#a371f7" stroke-width="2.5"  opacity="1"/><text x="266" y="504" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >LangSmith managed infrastructure</text><text x="266" y="528" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >A more opinionated runtime, the same trade-off as the harness</text><text x="266" y="548" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >stack above, but about deployment, not agent-definition logic:</text><rect x="266" y="580" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="284" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Agent Server</text><text x="284" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Durable runtime: streaming, task</text><text x="284" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >queues, crons, auth, webhooks.</text><rect x="542" y="580" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="560" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Sandboxes</text><text x="560" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Declared as backend.type in</text><text x="560" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >agent.json; LangSmith runs it.</text><rect x="818" y="580" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="836" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Memory</text><text x="836" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Lets the agent remember</text><text x="836" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >across interactions.</text><rect x="266" y="672" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="284" y="702" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Channels</text><text x="284" y="724" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Connects the agent to where</text><text x="284" y="741" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >its users already work.</text><rect x="542" y="672" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="560" y="702" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Context Hub</text><text x="560" y="724" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Manages instructions &amp; skills,</text><text x="560" y="741" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >editable without a redeploy.</text><rect x="818" y="672" width="256" height="76" rx="12" fill="none" stroke="#a371f7" stroke-width="1.6"  opacity="0.9"/><text x="836" y="702" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#a371f7" text-anchor="start" opacity="1"  >Evals</text><text x="836" y="724" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Tests agent behavior against</text><text x="836" y="741" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >Harbor eval tasks.</text><text x="266" y="778" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >The create_deep_agent() call itself doesn't change to get any of this:</text><text x="266" y="798" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" opacity="1"  >e.g. Sandboxes: declare it in agent.json, LangSmith runs it.</text><path d="M1110,398 C 1200,398 1200,510 1110,510" fill="none" stroke="#e6edf3" stroke-width="2.2" stroke-dasharray="2,6" opacity="0.85"/><polygon points="1110,510 1120,504.5 1120,515.5" fill="#e6edf3" opacity="0.85"/><text x="1218" y="427" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >deployed onto:</text><text x="1218" y="445" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >(the harness itself is</text><text x="1218" y="463" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >unchanged, but it gains</text><text x="1218" y="481" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start" opacity="0.9" font-style="italic" >everything below)</text><text x="80" y="926" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8b949e" text-anchor="start" opacity="1" font-style="italic" >"Deep Agents makes it easier to build capable agents. Managed Deep Agents makes it easier to run those agents in production." Source: langchain.com/blog/managed-deep-agents-is-now-in-public-beta</text>
</svg>